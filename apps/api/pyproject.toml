[project]
name = "yume-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ilham.kahar130899@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.1.7",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
yume-api = "yume_api.main:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=yume_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = ["error"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/yume_api"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with Ruff's formatter.
    "CPY001", # The project has no copyright-notice policy.
    "D", # Intentional package-wide exception: compact typed models and internal modules need no redundant docstrings.
    "ISC001", # Conflicts with Ruff's formatter.
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/yume_api/assets/validator.py" = [
    "ANN401", # JSON payload boundaries legitimately use Any after runtime validation.
    "EM101", # Direct exception messages retain validation context at the failure site.
    "EM102", # Direct exception messages retain validation context at the failure site.
    "TRY003", # Validation errors are intentionally constructed where invalid data is known.
    "TRY301", # Branch-local validation failures do not warrant one-off helper functions.
]
"tests/**/*.py" = [
    "INP001", # Test directories are deliberately namespace packages.
    "PLR2004", # Literal expected values make test intent legible.
    "S101", # Pytest assertions are the test API.
]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"

[tool.ty.terminal]
error-on-warning = true
