services:
  dashboard:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config/dashboard.yaml:/config/dashboard.yaml:ro
      - ./asset-packs:/asset-packs:ro
      - dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  fake-hermes:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    profiles: ["e2e"]
    working_dir: /tests
    command: /app/.venv/bin/uvicorn fake_hermes.app:app --host 127.0.0.1 --port 8642
    volumes:
      - ./tests:/tests:ro
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp

volumes:
  dashboard-data:
